name: 未加工零件自动更新

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
      trigger_source:
        description: '触发来源（控制台/人工）'
        required: false
        default: 'manual'
        type: string
      scheduled_for:
        description: '控制台计划时间，仅用于追踪和防重复'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: weijiagong-lingjian-guidang
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      DRIVE_DOWNLOAD_CACHE_DIR: '.cache/drive_files'
      SOURCE_RECORD_CACHE_FILE: '.cache/source_records.json'
      RUNTIME_STATE_FILE: 'runtime_state/state.json'
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: '1zM-DIWR_7ruB-41G7VETmVmCnKqB2WqM'
      WORKING_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      SPLIT_FOLDER_ID: '1lr9AUd9hO81Ylbkt4iJf88og4aazC797'
      RESULT_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      ARCHIVE_FOLDER_ID: '1YZ8CuDivBb4xCJz6qQvpspLmpTQgNUAz'

      # 前端“立即执行”和控制台后台调度都通过 workflow_dispatch 调用。
      # 本仓库自身不维护第二套固定业务 cron。
      TEST_MODE: ${{ inputs.mode == 'test' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # source cache 单独保持 .cache 路径，兼容此前已经生成的 weijiagong-v2 缓存版本。
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-${{ github.run_id }}
          restore-keys: |
            weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-
            weijiagong-v2-

      # runtime state 独立缓存，避免因为新增路径改变 .cache 的 Actions cache version。
      - name: Restore runtime state
        uses: actions/cache/restore@v4
        with:
          path: runtime_state
          key: weijiagong-runtime-v1-${{ github.run_id }}
          restore-keys: |
            weijiagong-runtime-v1-

      - name: Snapshot restored cache fingerprints
        id: cache_before
        shell: bash
        run: |
          hash_tree() {
            local dir="$1"
            if [ ! -d "$dir" ] || ! find "$dir" -type f -print -quit | grep -q .; then
              printf 'empty'
              return
            fi
            (cd "$dir" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}'
          }
          echo "source=$(hash_tree .cache)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(hash_tree runtime_state)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 语法检查与回归测试由独立“代码自检”CI在代码变更时执行；
      # 生产链路只负责恢复缓存并运行已验收的业务程序，减少每次更新的固定耗时。
      - name: Run update
        run: python production_main.py

      - name: Detect cache changes
        id: cache_changes
        shell: bash
        run: |
          hash_tree() {
            local dir="$1"
            if [ ! -d "$dir" ] || ! find "$dir" -type f -print -quit | grep -q .; then
              printf 'empty'
              return
            fi
            (cd "$dir" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | awk '{print $1}'
          }
          source_after="$(hash_tree .cache)"
          runtime_after="$(hash_tree runtime_state)"
          if [ "${{ steps.cache_before.outputs.source }}" = "$source_after" ]; then
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.cache_before.outputs.runtime }}" = "$runtime_after" ]; then
            echo "runtime_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save source cache
        if: ${{ success() && inputs.mode == 'production' && steps.cache_changes.outputs.source_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-${{ github.run_id }}

      - name: Save runtime state
        if: ${{ success() && inputs.mode == 'production' && steps.cache_changes.outputs.runtime_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: runtime_state
          key: weijiagong-runtime-v1-${{ github.run_id }}

      - name: Save execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
