name: 未加工零件自动更新

on:
  # 临时：用于本次云端只读验证；验证后移除 push。
  push:
    branches:
      - main
  schedule:
    # GitHub Actions 使用 UTC：09:25 = 北京时间17:25；14:00 = 北京时间22:00
    - cron: '25 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（首次测试保持 test）'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

# 云端并发保护：同一时间只允许一个流程运行；后来的运行排队，不取消正在执行的任务。
concurrency:
  group: weijiagong-lingjian-guidang
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # 正式 Google Drive 目录/文件（用户已确认）
      DRIVE_ROOT_FOLDER_ID: '1zM-DIWR_7ruB-41G7VETmVmCnKqB2WqM'
      WORKING_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      SPLIT_FOLDER_ID: '1lr9AUd9hO81Ylbkt4iJf88og4aazC797'
      RESULT_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      ARCHIVE_FOLDER_ID: '1YZ8CuDivBb4xCJz6qQvpspLmpTQgNUAz'
      CUMULATIVE_FILE_ID: '1BDXfJN8afgla9Z9Al-tVQmqP107afkPb'
      PENDING_FILE_ID: '1Lw91mzMQkqEx4sAn_U6JgHaDfa6bQpUG'

      # 定时/推送任务保持只读；手动可显式选择 production。
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && 'false' || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q main.py modules

      - name: Run update
        run: python main.py

      - name: Save execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save generated test workbooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-workbooks-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
