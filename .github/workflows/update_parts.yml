name: 未加工零件自动更新

on:
  # 本仓库不再维护固定 cron。
  # 定时启停和执行时间统一由生产控制台“定时设置”写入/移除 schedule。
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: weijiagong-lingjian-guidang
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      DRIVE_DOWNLOAD_CACHE_DIR: '.cache/drive_files'
      SOURCE_RECORD_CACHE_FILE: '.cache/source_records.json'
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: '1zM-DIWR_7ruB-41G7VETmVmCnKqB2WqM'
      WORKING_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      SPLIT_FOLDER_ID: '1lr9AUd9hO81Ylbkt4iJf88og4aazC797'
      RESULT_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      ARCHIVE_FOLDER_ID: '1YZ8CuDivBb4xCJz6qQvpspLmpTQgNUAz'
      CUMULATIVE_FILE_ID: '1BDXfJN8afgla9Z9Al-tVQmqP107afkPb'
      PENDING_FILE_ID: '1Lw91mzMQkqEx4sAn_U6JgHaDfa6bQpUG'

      # 控制台手动执行固定传 production；直接在 GitHub 手动执行默认 test。
      # 若控制台启用定时并写入 schedule，定时事件自动按正式生产运行。
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-${{ github.run_id }}
          restore-keys: |
            weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q main.py modules tests

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Run update
        run: python main.py

      - name: Save incremental cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-${{ github.run_id }}

      - name: Save execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
