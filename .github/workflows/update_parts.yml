name: 未加工零件自动更新

on:
  schedule:
    # 北京时间17:25和22:00
    # GitHub Actions 使用UTC时间
    - cron: '25 9 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
      RESULT_FOLDER_ID: ${{ secrets.RESULT_FOLDER_ID }}
      ARCHIVE_FOLDER_ID: ${{ secrets.ARCHIVE_FOLDER_ID }}
      TEST_MODE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update
        run: python main.py
        continue-on-error: false

      - name: Save execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log
          path: logs/
          if-no-files-found: ignore
