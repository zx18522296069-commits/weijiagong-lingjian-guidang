name: 临时回滚未加工稳定版

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback_unprocessed_runtime.yml'

permissions:
  contents: write

concurrency:
  group: rollback-weijiagong-runtime
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last production-stable runtime files
        run: |
          set -euo pipefail
          STABLE=5fc7eee1e1e2714e71e88c44b005c3ee3505fa32
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$STABLE" -- \
            main.py \
            modules/drive_manager.py \
            modules/excel_generator.py \
            modules/process_parts.py \
            .github/workflows/update_parts.yml \
            README.md
          git rm -f --ignore-unmatch \
            modules/runtime_state.py \
            tests/test_incremental_acceptance.py \
            tests/test_runtime_state.py
          git rm -f .github/workflows/rollback_unprocessed_runtime.yml
          git add -A
          git diff --cached --stat
          git commit -m "回滚未加工到生产稳定基线"
          git push origin HEAD:main
