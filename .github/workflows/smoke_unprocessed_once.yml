name: 未加工真实冒烟测试（临时）

# smoke-generation: 2
on:
  push:
    paths:
      - '.github/workflows/smoke_unprocessed_once.yml'

permissions:
  contents: read

concurrency:
  group: weijiagong-lingjian-guidang
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      DRIVE_DOWNLOAD_CACHE_DIR: '.cache/drive_files'
      SOURCE_RECORD_CACHE_FILE: '.cache/source_records.json'
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: '1zM-DIWR_7ruB-41G7VETmVmCnKqB2WqM'
      WORKING_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      SPLIT_FOLDER_ID: '1lr9AUd9hO81Ylbkt4iJf88og4aazC797'
      RESULT_FOLDER_ID: '1PGM1ZEbHk2v3CAZPfwHdqC2EV_kHNzJH'
      ARCHIVE_FOLDER_ID: '1YZ8CuDivBb4xCJz6qQvpspLmpTQgNUAz'
      TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Restore incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-${{ github.run_id }}
          restore-keys: |
            weijiagong-v2-${{ hashFiles('modules/excel_reader.py', 'modules/source_cache.py') }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Real production smoke run
        run: python safe_main.py
      - name: Save execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
