<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>生产任务控制台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;background:#f4f7fb;line-height:1.5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef3f9 0,#f8fafc 48%,#fff 100%)}button,input{font:inherit}
.shell{max-width:1120px;margin:0 auto;padding:32px 20px 64px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}
.eyebrow{margin:0 0 6px;color:#64748b;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.top h1{margin:0;font-size:32px;letter-spacing:-.04em}.top p{margin:8px 0 0;color:#64748b}
.logout{border:1px solid #dbe3ed;background:#fff;border-radius:12px;padding:9px 13px;color:#475569;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(255,255,255,.94);border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:22px}
.card.parts{border-top:4px solid #2563eb}.card.split{border-top:4px solid #7c3aed}.taskhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.taskhead h2{margin:0;font-size:25px}.taskhead p{margin:7px 0 0;color:#64748b}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:800;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.badge.running .dot{background:#f59e0b}.badge.success .dot{background:#22c55e}.badge.failed .dot{background:#ef4444}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.meta div{padding:12px;border:1px solid #e8eef5;background:#f8fafc;border-radius:14px}.meta span{display:block;color:#64748b;font-size:11px}.meta strong{display:block;margin-top:4px;font-size:13px;word-break:break-word}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary.parts{background:#2563eb;color:#fff}.primary.split{background:#7c3aed;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{margin-top:14px;padding:11px 13px;border-radius:12px;background:#eff6ff;color:#1e3a8a;font-size:13px}.notice.ok{background:#f0fdf4;color:#166534}.notice.error{background:#fef2f2;color:#991b1b}
.results{margin-top:20px}.results h2{margin:0 0 14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.stat span{display:block;color:#64748b;font-size:11px}.stat strong{display:block;margin-top:3px;font-size:24px}
.list{display:grid;gap:9px;margin-top:14px}.row{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(130px,.8fr) 1.5fr;gap:12px;align-items:start;border:1px solid #e2e8f0;background:#fff;border-radius:13px;padding:12px}.row small{color:#64748b}.empty{padding:24px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:14px}
.login{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:22px;z-index:20}.loginbox{width:min(420px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.loginbox h2{margin:4px 0 6px}.loginbox p{color:#64748b}.loginbox input{width:100%;margin:16px 0 12px;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px}.loginbox .enter{width:100%;background:#0f172a;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.hidden{display:none!important}
@media(max-width:820px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.shell{padding:22px 14px 48px}.top h1{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div><p class="eyebrow">火切生产中心 · Vercel</p><h1>生产任务控制台</h1><p>拆图 + 未加工更新，一个网址统一操作。</p></div>
  <button class="logout" id="logout">退出</button>
</header>

<section class="grid">
  <article class="card parts">
    <div class="taskhead">
      <div><p class="eyebrow">任务 01</p><h2>未加工更新</h2><p>扫描拆图结果，更新累计台账与当前待加工零件。</p></div>
      <span class="badge" id="badge-parts"><span class="dot"></span><span id="text-parts">读取中</span></span>
    </div>
    <div class="meta"><div><span>仓库</span><strong>weijiagong-lingjian-guidang</strong></div><div><span>最后执行</span><strong id="time-parts">—</strong></div></div>
    <div class="actions">
      <button class="btn primary parts" id="run-parts">立即执行</button>
      <button class="btn secondary" id="refresh-parts">刷新状态</button>
      <button class="btn secondary" id="result-parts">查看结果</button>
    </div>
    <div class="notice" id="notice-parts">正在连接控制服务…</div>
  </article>

  <article class="card split">
    <div class="taskhead">
      <div><p class="eyebrow">任务 02</p><h2>拆图</h2><p>扫描待拆图纸，匹配订单资料并生成拆图结果。</p></div>
      <span class="badge" id="badge-split"><span class="dot"></span><span id="text-split">读取中</span></span>
    </div>
    <div class="meta"><div><span>仓库</span><strong>tuzhichaifen</strong></div><div><span>最后执行</span><strong id="time-split">—</strong></div></div>
    <div class="actions">
      <button class="btn primary split" id="run-split">立即执行</button>
      <button class="btn secondary" id="refresh-split">刷新状态</button>
      <button class="btn secondary" id="result-split">查看结果</button>
    </div>
    <div class="notice" id="notice-split">正在连接控制服务…</div>
  </article>
</section>

<section class="card results">
  <h2 id="result-title">运行结果</h2>
  <div class="summary" id="summary">
    <div class="stat"><span>扫描</span><strong>—</strong></div>
    <div class="stat"><span>成功</span><strong>—</strong></div>
    <div class="stat"><span>异常/重复</span><strong>—</strong></div>
    <div class="stat"><span>未成功/跳过</span><strong>—</strong></div>
  </div>
  <div class="list" id="rows"><div class="empty">点击任一任务的“查看结果”。</div></div>
</section>
</div>

<div class="login" id="login">
  <form class="loginbox" id="loginForm">
    <p class="eyebrow">内部操作验证</p>
    <h2>生产任务控制台</h2>
    <p>请输入原生产控制台操作口令。一次登录即可操作两个任务。</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="操作口令">
    <button class="enter" type="submit">进入控制台</button>
    <div class="notice hidden" id="loginNotice"></div>
  </form>
</div>

<script>
const API_PROXY='/api/proxy';
const store='control-panel-key';
const active=new Set(['in_progress','queued','requested','waiting']);
const statusMap={success:'成功',partial:'部分完成',failure:'失败',cancelled:'已取消',in_progress:'运行中',queued:'排队中',requested:'已提交',waiting:'等待中',no_runs:'暂无记录',api_error:'读取失败',unknown:'未知'};
const $=id=>document.getElementById(id);
const cfg={
  parts:{run:'/api/run/parts',result:'/api/results/parts',label:'未加工更新'},
  split:{run:'/api/run/split',result:'/api/results/split',label:'拆图'}
};
function key(){return sessionStorage.getItem(store)||''}
function fmt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function note(task,msg,type=''){$('notice-'+task).className='notice '+type;$('notice-'+task).textContent=msg}
function authFail(msg){sessionStorage.removeItem(store);$('login').classList.remove('hidden');$('loginNotice').className='notice error';$('loginNotice').textContent=msg||'操作口令无效'}
async function req(path,opt={}){
  let res;try{res=await fetch(API_PROXY+'?path='+encodeURIComponent(path),{...opt,headers:{'Content-Type':'application/json','X-Control-Key':key(),...(opt.headers||{})}})}catch{throw new Error('控制服务未连接')}
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.status==='error'){const m=data.detail||data.message||('请求失败（'+res.status+'）');if(res.status===401)authFail(m);throw new Error(m)}
  return data;
}
function setStatus(task,t){
  const s=(t&&t.status)||'unknown';$('text-'+task).textContent=statusMap[s]||s;
  $('badge-'+task).className='badge '+(s==='success'?'success':active.has(s)||s==='partial'?'running':['failure','cancelled','api_error'].includes(s)?'failed':'');
  $('time-'+task).textContent=fmt(t&&(t.updated_at||t.run_started_at));
  $('run-'+task).disabled=active.has(s);$('run-'+task).textContent=active.has(s)?'任务运行中':'立即执行';
}
async function refresh(task,silent=false){
  try{const data=await req('/api/status');const t=data[task]||data.tasks?.[task]||{};setStatus(task,t);if(!silent)note(task,'状态已刷新','ok')}
  catch(e){if(!silent)note(task,e.message,'error')}
}
async function run(task){
  if($('run-'+task).disabled)return;$('run-'+task).disabled=true;note(task,'正在提交任务…');
  try{await req(cfg[task].run,{method:'POST'});note(task,'任务已提交，正在等待 GitHub Actions 执行','ok');await refresh(task,true);setTimeout(()=>refresh(task,true),2500)}
  catch(e){note(task,e.message,'error');$('run-'+task).disabled=false}
}
function arr(v){return Array.isArray(v)?v:[]}
function titleOf(x){return x.board_id||x.title||x.filename||'未命名项目'}
function detailOf(x){return x.cause||x.reason||x.detail||x.record_status||'—'}
async function loadResult(task){
  note(task,'正在读取最近结果…');
  try{
    const data=await req(cfg[task].result);$('result-title').textContent=cfg[task].label+' · 最近一次运行结果';
    let total=0,success=0,third=0,fourth=0,items=[];
    if(task==='parts'){
      const m=new Map();[...arr(data.board_results),...arr(data.successes),...arr(data.issues)].forEach(x=>{const n=titleOf(x);if(/^#|^废/.test(n)||x.board_id)m.set(n,x)});
      items=[...m.values()];total=items.length;
      items.forEach(x=>{const s=String(x.record_status||'')+' '+detailOf(x);if(/补归档|重复/.test(s))third++;else if(/未累计|未记录|阻断|冲突|失败/.test(s))fourth++;else success++;});
    }else{
      const good=arr(data.successes),bad=arr(data.issues),skip=arr(data.warnings);
      success=good.length;third=bad.length;fourth=skip.length;total=Math.max(Number(data.completion?.total||0),success+third+fourth);
      items=[...bad.map(x=>({...x,_kind:'未拆出'})),...skip.map(x=>({...x,_kind:'已跳过'})),...good.slice(0,30).map(x=>({...x,_kind:'成功'}))];
    }
    $('summary').innerHTML='<div class="stat"><span>扫描</span><strong>'+total+'</strong></div><div class="stat"><span>成功</span><strong>'+success+'</strong></div><div class="stat"><span>'+(task==='parts'?'重复已处理':'未拆出')+'</span><strong>'+third+'</strong></div><div class="stat"><span>'+(task==='parts'?'未成功':'已跳过')+'</span><strong>'+fourth+'</strong></div>';
    const rows=$('rows');rows.innerHTML='';
    if(!items.length)rows.innerHTML='<div class="empty">本次没有可展示的逐项结果。</div>';
    else items.forEach(x=>{const el=document.createElement('div');el.className='row';el.innerHTML='<strong></strong><span></span><small></small>';el.children[0].textContent=titleOf(x);el.children[1].textContent=x._kind||x.record_status||'处理结果';el.children[2].textContent=detailOf(x);rows.appendChild(el)});
    note(task,'最近结果已更新','ok');
  }catch(e){note(task,e.message,'error')}
}
['parts','split'].forEach(task=>{
  $('run-'+task).onclick=()=>run(task);
  $('refresh-'+task).onclick=()=>refresh(task);
  $('result-'+task).onclick=()=>loadResult(task);
});
$('logout').onclick=()=>{sessionStorage.removeItem(store);$('login').classList.remove('hidden')};
$('loginForm').onsubmit=async e=>{e.preventDefault();const v=$('key').value.trim();if(!v)return;sessionStorage.setItem(store,v);$('loginNotice').className='notice';$('loginNotice').textContent='正在验证…';try{await Promise.all([refresh('parts',true),refresh('split',true)]);$('login').classList.add('hidden');$('key').value='';$('loginNotice').className='notice hidden';note('parts','控制服务已连接','ok');note('split','控制服务已连接','ok')}catch(err){authFail(err.message)}};
if(key()){
  $('login').classList.add('hidden');
  Promise.all([refresh('parts',true),refresh('split',true)]).then(()=>{
    note('parts','控制服务已连接','ok');
    note('split','控制服务已连接','ok');
  });
}else{
  $('login').classList.remove('hidden');
}
setInterval(()=>{if(key()){refresh('parts',true);refresh('split',true)}},10000);
</script>
</body>
</html>
